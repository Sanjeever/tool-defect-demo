<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>刀具视觉工作台</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-symbol" aria-hidden="true">◈</span
        ><span>刀具视觉<span class="brand-small">本地工作台</span></span>
      </div>
      <nav aria-label="工作区">
        <button class="nav-item active" data-page="capture">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h4l2-3h4l2 3h4v13H4z" />
            <circle cx="12" cy="13" r="4" /></svg
          >采集
        </button>
        <button class="nav-item" data-page="library">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 4h16v16H4zM4 15l5-5 5 5 3-3 3 3" />
            <circle cx="15" cy="8" r="1" /></svg
          >图片与标注<span id="nav-count" class="nav-count">0</span>
        </button>
        <button class="nav-item" data-page="training">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 19V9m7 10V4m7 15v-7M3 21h18" /></svg
          >训练
        </button>
      </nav>
      <div class="sidebar-bottom">
        <span class="status-dot"></span>本机服务<span class="mono"
          >127.0.0.1</span
        >
      </div>
    </aside>
    <main>
      <header class="page-header">
        <h1 id="page-title">采集</h1>
        <div id="workspace-count" class="muted"></div>
      </header>
      <div id="error" class="error-banner" role="alert" hidden></div>

      <section id="page-capture" class="page">
        <div class="capture-layout">
          <div class="capture-main">
            <div class="panel image-panel">
              <div class="panel-toolbar">
                <span class="toolbar-title"
                  ><span id="camera-dot" class="status-dot idle"></span
                  ><span id="camera-state">尚未预览</span></span
                ><span id="camera-dimensions" class="mono muted"></span>
              </div>
              <div class="camera-stage">
                <img id="camera-image" alt="相机采集画面" hidden />
                <div id="camera-empty" class="canvas-empty">
                  <svg viewBox="0 0 48 48" aria-hidden="true">
                    <path d="M7 13h10l4-6h8l4 6h8v28H7z" />
                    <circle cx="24" cy="26" r="9" /></svg
                  ><span>等待相机画面</span>
                </div>
              </div>
              <div class="capture-toolbar">
                <div class="button-row">
                  <button id="preview-once" class="button">刷新预览</button
                  ><button id="preview-toggle" class="button">连续预览</button>
                </div>
                <button id="capture-button" class="button primary">
                  <span class="shutter" aria-hidden="true"></span>拍照保存
                </button>
              </div>
            </div>
            <div class="section-line">
              <h2>最近采集</h2>
              <button class="text-button" id="open-library">
                查看图片库 <span aria-hidden="true">↗</span>
              </button>
            </div>
            <div id="recent-images" class="recent-images"></div>
            <p
              id="capture-result"
              class="muted file-line"
              aria-live="polite"
            ></p>
          </div>
          <aside class="panel capture-settings">
            <h2>采集归档</h2>
            <label
              >样品类型<input
                id="capture-type"
                value="type_01"
                list="type-options"
                autocomplete="off"
            /></label>
            <label
              >实体编号<input
                id="capture-specimen"
                value="bad_01"
                list="specimen-options"
                autocomplete="off"
            /></label>
            <fieldset class="quality-field">
              <legend>样品标签</legend>
              <div class="segmented">
                <label
                  ><input
                    type="radio"
                    name="capture-quality"
                    value="good"
                  /><span>好件</span></label
                ><label
                  ><input
                    type="radio"
                    name="capture-quality"
                    value="defect"
                    checked
                  /><span>坏件</span></label
                ><label
                  ><input
                    type="radio"
                    name="capture-quality"
                    value="unknown"
                  /><span>待确认</span></label
                >
              </div>
            </fieldset>
            <div class="settings-divider"></div>
            <div class="section-line compact">
              <h2>相机</h2>
              <button id="enumerate" class="text-button">枚举设备</button>
            </div>
            <label
              >序列号<input
                id="camera-sn"
                class="mono"
                value="GL0180040948"
                list="device-options"
            /></label>
            <p id="device-result" class="muted small" aria-live="polite"></p>
            <details>
              <summary>采集参数</summary>
              <label
                >数据包间隔<input
                  id="packet-delay"
                  type="number"
                  min="0"
                  max="1000000"
                  value="20000" /></label
              ><label
                >GalaxySDK 目录<input
                  id="sdk-root"
                  value="C:\Program Files\Daheng Imaging\GalaxySDK"
              /></label>
            </details>
          </aside>
        </div>
      </section>

      <section id="page-library" class="page" hidden>
        <div class="library-toolbar">
          <div class="button-row">
            <label class="inline-label"
              >类型<select id="library-type">
                <option value="">全部类型</option>
              </select></label
            ><label class="inline-label"
              >标签<select id="library-quality">
                <option value="">全部标签</option>
                <option value="good">好件</option>
                <option value="defect">坏件</option>
                <option value="unknown">待确认</option>
              </select></label
            >
          </div>
          <button id="import-images" class="button">导入已有采集图片</button>
        </div>
        <div class="library-layout">
          <aside class="panel filmstrip">
            <div id="image-list" class="image-list"></div>
          </aside>
          <div class="annotation-main panel">
            <div class="panel-toolbar">
              <span id="annotation-name" class="toolbar-title">未选择图片</span
              ><a
                id="original-link"
                class="text-button"
                target="_blank"
                rel="noopener"
                hidden
                >原图 ↗</a
              >
            </div>
            <div id="annotation-stage" class="annotation-stage">
              <div id="annotation-empty" class="canvas-empty">选择一张图片</div>
              <svg
                id="annotation-canvas"
                role="img"
                aria-label="缺陷矩形标注画布"
                hidden
              >
                <image id="annotation-image" x="0" y="0" />
                <g id="annotation-boxes"></g>
              </svg>
            </div>
            <div class="annotation-toolbar">
              <span id="annotation-dimensions" class="mono muted small"></span
              ><span
                id="annotation-save-state"
                class="muted small"
                aria-live="polite"
              ></span>
            </div>
          </div>
          <aside class="panel annotation-settings">
            <div id="annotation-fields" hidden>
              <h2>图片审核</h2>
              <label class="checkbox-label"
                ><input id="image-included" type="checkbox" />用于数据集</label
              >
              <div class="section-line">
                <h2>缺陷标注</h2>
                <button id="undo-box" class="text-button">撤销末框</button>
              </div>
              <label
                >缺陷名称<input
                  id="box-label"
                  placeholder="填写已确认的缺陷名称"
                  maxlength="80"
              /></label>
              <p class="muted small">在图上拖动绘制矩形，坐标按原图保存。</p>
              <div id="box-list" class="box-list"></div>
              <button id="save-annotation" class="button primary full-width">
                保存图片标注
              </button>
              <div class="settings-divider"></div>
              <h2>实体分组</h2>
              <p id="specimen-key" class="mono small"></p>
              <label
                >好坏标签<select id="specimen-quality">
                  <option value="good">好件</option>
                  <option value="defect">坏件</option>
                  <option value="unknown">待确认</option>
                </select></label
              >
              <label
                >数据集<select id="specimen-split">
                  <option value="unassigned">未分配</option>
                  <option value="train">训练集</option>
                  <option value="val">验证集</option>
                  <option value="test">测试集</option>
                </select></label
              >
              <label id="category-field"
                >缺陷类别<input
                  id="specimen-category"
                  maxlength="80"
                  placeholder="YOLO 分类时填写"
              /></label>
              <p class="muted small">分组和好坏标签应用于该实体的所有图片。</p>
              <button id="save-specimen" class="button full-width">
                保存实体分组
              </button>
            </div>
          </aside>
        </div>
      </section>

      <section id="page-training" class="page" hidden>
        <div class="training-layout">
          <div class="training-main">
            <div class="panel dataset-panel">
              <div class="section-line compact">
                <h2>数据集检查</h2>
                <button id="check-dataset" class="text-button">重新检查</button>
              </div>
              <div id="dataset-summary"></div>
              <div
                id="dataset-issues"
                class="dataset-issues"
                aria-live="polite"
              ></div>
            </div>
            <div class="section-line">
              <h2>训练任务</h2>
              <span id="job-count" class="muted small"></span>
            </div>
            <div id="job-list" class="job-list"></div>
            <div class="panel log-panel">
              <div class="panel-toolbar">
                <span id="log-title" class="toolbar-title">任务日志</span>
                <div id="job-artifacts" class="button-row"></div>
              </div>
              <pre id="job-log" tabindex="0">尚未选择任务</pre>
            </div>
          </div>
          <aside class="panel training-settings">
            <h2>新建训练</h2>
            <label
              >样品类型<input
                id="train-type"
                value="type_01"
                list="type-options"
            /></label>
            <label
              >模型<select id="train-model">
                <option value="patchcore">PatchCore · 异常检测</option>
                <option value="classifier">YOLO · 已知缺陷分类</option>
              </select></label
            >
            <label
              >运行设备<select id="train-device">
                <option value="cuda">CUDA</option>
                <option value="cpu">CPU</option>
              </select></label
            >
            <label
              >批量大小<input
                id="train-batch"
                type="number"
                min="1"
                max="64"
                value="4"
            /></label>
            <label id="epochs-field" hidden
              >训练轮数<input
                id="train-epochs"
                type="number"
                min="1"
                max="1000"
                value="30"
            /></label>
            <details>
              <summary>图像预处理</summary>
              <label
                >统一 ROI（可选）<input
                  id="train-roi"
                  placeholder="左,上,右,下"
              /></label>
              <p class="muted small">
                等比例缩放并补边到
                256×256。矩形缺陷框用于记录位置，当前模型按图片标签训练。
              </p>
            </details>
            <div id="train-availability" class="muted small"></div>
            <button
              id="start-training"
              class="button primary full-width"
              disabled
            >
              预处理并开始训练
            </button>
          </aside>
        </div>
      </section>
    </main>
    <datalist id="type-options"></datalist
    ><datalist id="specimen-options"></datalist
    ><datalist id="device-options"></datalist>
  </body>
</html>
