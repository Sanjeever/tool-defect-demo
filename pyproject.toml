[project]
name = "tool-defect-demo"
version = "0.1.0"
description = "使用 Anomalib 与 Geti 的本机刀具检测工作台"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anomalib==2.7.0",
    "fastapi>=0.115,<1",
    "imagecodecs==2024.12.30",
    "numpy==1.26.4",
    "opencv-python-headless==4.11.0.86",
    "pillow>=11,<13",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "uvicorn>=0.34,<1",
]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[dependency-groups]
dev = ["httpx>=0.28,<1"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
